[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Requests to /.netlify/functions/* are reserved by Netlify and resolved before
# the redirect rules below, so the /* catch-all does not swallow them.

# The private finance tool must never be indexed. Two rules are required:
# `for = "/ecosistema"` does NOT match "/ecosistema/" or "/ecosistema/anything".
[[headers]]
  for = "/ecosistema"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache"

[[headers]]
  for = "/ecosistema/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache"

# The finance app resolves to its own shell, not the portfolio's. BOTH rules are
# required: "/ecosistema/*" does not match the bare "/ecosistema", and without this
# first rule the bare path falls through to the catch-all and silently serves the
# PORTFOLIO. Both MUST stay above the catch-all — the first matching rule wins.
[[redirects]]
  from = "/ecosistema"
  to = "/ecosistema/index.html"
  status = 200

[[redirects]]
  from = "/ecosistema/*"
  to = "/ecosistema/index.html"
  status = 200

[[redirects]]
  from = "/finanzas"
  to = "/ecosistema/index.html"
  status = 200

[[redirects]]
  from = "/finanzas/*"
  to = "/ecosistema/index.html"
  status = 200

[[redirects]]
  from = "/superadmin"
  to = "/ecosistema/index.html"
  status = 200

[[redirects]]
  from = "/superadmin/*"
  to = "/ecosistema/index.html"
  status = 200

# Handles single-page app routing redirects (critical for React apps)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
